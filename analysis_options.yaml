# Static analysis config. Run with `flutter analyze`.
# Base: flutter_lints. Added rules below are correctness-focused (catch bugs,
# leaks, missed awaits) rather than pure style, to keep signal high on a large
# existing codebase. None are escalated to errors, so the build is not broken;
# CI gates on errors only for now and can be tightened later.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"
  errors:
    # Generated-annotation noise from some codegen packages.
    invalid_annotation_target: ignore

linter:
  rules:
    # --- correctness / bug-catching ---
    unawaited_futures: true          # missed await -> silent async bugs
    avoid_empty_else: true
    cancel_subscriptions: true       # StreamSubscription leaks
    close_sinks: true                # Sink/controller leaks
    no_adjacent_strings_in_list: true
    avoid_relative_lib_imports: true
    depend_on_referenced_packages: true
    # --- consistency (low noise, high value) ---
    avoid_print: true
    prefer_single_quotes: true
    sort_pub_dependencies: true
    use_super_parameters: true
